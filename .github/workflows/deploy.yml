name: 🚀 Deploy GamingDronzz

on:
  push:
    branches: [staging, release]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy Environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      force_deploy:
        description: 'Force deployment (ignore cache)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '18'
  WORKING_DIRECTORY: './site'

jobs:
  build:
    name: 🔨 Build Application
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🎯 Set Environment
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/release" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          fi
          
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json
          
      - name: 📦 Install Dependencies
        run: npm ci
        
      - name: 🔍 Run Linting
        run: npm run lint
        
      - name: 🏗️ Build Application
        run: |
          if [[ "${{ steps.set-env.outputs.environment }}" == "production" ]]; then
            echo "Building for PRODUCTION"
            npm run build:production
          else
            echo "Building for STAGING"
            npm run build:staging
          fi
        env:
          REACT_APP_ENVIRONMENT: ${{ steps.set-env.outputs.environment }}
          REACT_APP_GA_TRACKING_ID: ${{ steps.set-env.outputs.environment == 'production' && secrets.GA_TRACKING_ID || '' }}
          
      - name: 📁 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ steps.set-env.outputs.environment }}
          path: ${{ env.WORKING_DIRECTORY }}/dist/
          retention-days: 1

  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.gamingdronzz.com
      
    steps:
      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-staging
          path: dist/
          
      - name: 🌐 Deploy via SCP to Staging Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_STAGING_HOST }}
          username: ${{ secrets.DO_STAGING_USER }}
          key: ${{ secrets.DO_STAGING_SSH_KEY }}
          source: "dist/"
          target: ${{ secrets.DO_STAGING_PATH }}
          strip_components: 1
          rm: true

      - name: 🔄 Set File Permissions on Staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_STAGING_HOST }}
          username: ${{ secrets.DO_STAGING_USER }}
          key: ${{ secrets.DO_STAGING_SSH_KEY }}
          script: |
            chmod -R 755 ${{ secrets.DO_STAGING_PATH }}
            
      - name: ✅ Deployment Success
        run: |
          echo "🎉 Successfully deployed to staging!"
          echo "🌐 Visit: https://staging.gamingdronzz.com"

  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.environment == 'production'
    environment:
      name: production
      url: https://gamingdronzz.com
      
    steps:
      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-production
          path: dist/
          
      - name: 🌐 Deploy via SCP to Production Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_PROD_HOST }}
          username: ${{ secrets.DO_PROD_USER }}
          key: ${{ secrets.DO_PROD_SSH_KEY }}
          source: "dist/"
          target: ${{ secrets.DO_PROD_PATH }}
          strip_components: 1
          rm: true

      - name: 🔄 Set File Permissions on Production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_PROD_HOST }}
          username: ${{ secrets.DO_PROD_USER }}
          key: ${{ secrets.DO_PROD_SSH_KEY }}
          script: |
            chmod -R 755 ${{ secrets.DO_PROD_PATH }}
            
      - name: ✅ Production Deployment Success
        run: |
          echo "🎉 Successfully deployed to production!"
          echo "🌐 Visit: https://gamingdronzz.com"

  notify:
    name: 📢 Send Notifications
    runs-on: ubuntu-latest
    needs: [build, deploy-staging, deploy-production]
    if: always()
    
    steps:
      - name: 📱 Notify Success
        if: needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success'
        run: |
          ENV="${{ needs.build.outputs.environment }}"
          if [[ "$ENV" == "staging" ]]; then
            echo "✅ Staging deployment successful!"
          else
            echo "✅ Production deployment successful!"
          fi
          
      - name: 🚨 Notify Failure
        if: needs.build.result == 'failure' || needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure'
        run: |
          echo "❌ Deployment failed!"
          echo "Check the logs for details"
